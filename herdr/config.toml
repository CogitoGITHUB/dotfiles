onboarding = false
[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
# shape-white thin: all text white, no background (transparent)
# active/selection stay dark so white text stays readable
panel_bg      = "reset"
sidebar_bg    = "reset"
active_row_bg = "#1e1e2e"
selection_bg  = "#313244"
surface0      = "reset"
surface1      = "reset"
surface_dim   = "reset"
overlay0  = "#FFFFFF"
overlay1  = "#FFFFFF"
text      = "#FFFFFF"
subtext0  = "#FFFFFF"
accent    = "#FFFFFF"
mauve     = "#FFFFFF"
red       = "#FFFFFF"
green     = "#FFFFFF"
yellow    = "#FFFFFF"
blue      = "#FFFFFF"
teal      = "#FFFFFF"
peach     = "#FFFFFF"

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = false
pane_borders = "off"
pane_outer_borders = false
pane_gaps = false
pane_scrollbars = false
hide_tab_bar_when_single_tab = false

agent_panel_sort = "priority"
status_indicators = "symbols"
[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

[terminal]
default_shell = "nu"

[ui.sound]
enabled = true
